[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "powcoin-local"
version = "0.1.0"
description = "Experimental configurable PoW cryptocurrency with full nodes and encrypted wallets"
requires-python = ">=3.10"
dependencies = ["cryptography>=46.0.0,<47"]

[project.scripts]
powcoin = "powcoin.cli:main"
powcoin-demo = "powcoin.desktop:main"

[tool.setuptools.packages.find]
include = ["powcoin*"]
